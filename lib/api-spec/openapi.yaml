openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account and session operations
  - name: reviews
    description: User reviews of the app
  - name: admin
    description: Admin-only operations
  - name: planner
    description: Study planning operations
  - name: settings
    description: Per-user preferences
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/apple:
    post:
      operationId: authApple
      tags: [auth]
      summary: Sign in with an Apple identity token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleAuthInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Token could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/google:
    post:
      operationId: authGoogle
      tags: [auth]
      summary: Sign in with a Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Token could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Set or change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password updated
        "400":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Signed out
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/account:
    patch:
      operationId: updateAccount
      tags: [auth]
      summary: Update the signed-in user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Permanently delete the signed-in account and all its data
      responses:
        "204":
          description: Account deleted
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: All reviews plus the average rating
      responses:
        "200":
          description: Review list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reviews/me:
    put:
      operationId: upsertMyReview
      tags: [reviews]
      summary: Create or update the signed-in user's review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "200":
          description: Saved review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyReview
      tags: [reviews]
      summary: Remove the signed-in user's review
      responses:
        "204":
          description: Review removed
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [admin]
      summary: Delete any review (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Review deleted
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: App-wide counts
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: All user accounts
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}:
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Permanently delete a user account and all its data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Account deleted
        "400":
          description: Can't delete your own account here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{id}/role:
    patch:
      operationId: setUserRole
      tags: [admin]
      summary: Promote or demote a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid role or self-change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: The signed-in user's preferences
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update the signed-in user's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /planner/dashboard:
    get:
      operationId: getPlannerDashboard
      tags: [planner]
      summary: Get the current study dashboard
      description: Returns today's focus, upcoming study sessions, deadlines, and workload summary.
      responses:
        "200":
          description: Planner dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerDashboard"
  /planner/sessions:
    get:
      operationId: listPlannerSessions
      tags: [planner]
      summary: Every study session for the signed-in user
      description: All scheduled and completed sessions, for the calendar view.
      responses:
        "200":
          description: Study sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerSessionList"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /planner/plans:
    post:
      operationId: createStudyPlan
      tags: [planner]
      summary: Turn a natural-language note into a study plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanInput"
      responses:
        "201":
          description: Created study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"
        "400":
          description: Invalid plan input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearPlanner
      tags: [planner]
      summary: Delete all of the signed-in user's assignments, tasks, and sessions
      responses:
        "204":
          description: Planner cleared
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /planner/tasks/{id}:
    patch:
      operationId: updatePlannerTask
      tags: [planner]
      summary: Update a study task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated study task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyTask"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /planner/sessions/{id}/complete:
    post:
      operationId: completeStudySession
      tags: [planner]
      summary: Mark a study session complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Completed study session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /planner/sessions/{id}/reschedule:
    post:
      operationId: rescheduleStudySession
      tags: [planner]
      summary: Move a study session to another day
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRescheduleInput"
      responses:
        "200":
          description: Rescheduled study session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    User:
      type: object
      properties:
        id:
          type: number
        email:
          type: string
        displayName:
          oneOf:
            - type: string
            - type: "null"
        role:
          type: string
          enum: [user, admin]
        hasPassword:
          type: boolean
        providers:
          type: array
          items:
            type: string
            enum: [apple, google]
      required: [id, email, displayName, role, hasPassword, providers]
    AdminStats:
      type: object
      properties:
        userCount:
          type: number
        adminCount:
          type: number
        reviewCount:
          type: number
        averageRating:
          type: number
        assignmentCount:
          type: number
        sessionCount:
          type: number
        signupsLast7Days:
          type: number
      required:
        - userCount
        - adminCount
        - reviewCount
        - averageRating
        - assignmentCount
        - sessionCount
        - signupsLast7Days
    AdminUser:
      type: object
      properties:
        id:
          type: number
        email:
          type: string
        displayName:
          oneOf:
            - type: string
            - type: "null"
        role:
          type: string
          enum: [user, admin]
        createdAt:
          type: string
        reviewCount:
          type: number
        assignmentCount:
          type: number
      required:
        - id
        - email
        - displayName
        - role
        - createdAt
        - reviewCount
        - assignmentCount
    AdminUserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
      required: [users]
    SetRoleInput:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin]
      required: [role]
    AuthResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
        displayName:
          type: string
      required: [email, password]
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]
    UpdateAccountInput:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 80
      required: [displayName]
    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [newPassword]
    AppleAuthInput:
      type: object
      properties:
        identityToken:
          type: string
          minLength: 1
      required: [identityToken]
    GoogleAuthInput:
      type: object
      properties:
        idToken:
          type: string
          minLength: 1
      required: [idToken]
    Review:
      type: object
      properties:
        id:
          type: number
        rating:
          type: number
        body:
          oneOf:
            - type: string
            - type: "null"
        authorName:
          oneOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
        mine:
          type: boolean
      required: [id, rating, body, authorName, createdAt, mine]
    ReviewSummary:
      type: object
      properties:
        average:
          type: number
        count:
          type: number
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        myReview:
          oneOf:
            - $ref: "#/components/schemas/Review"
            - type: "null"
      required: [average, count, reviews, myReview]
    ReviewInput:
      type: object
      properties:
        rating:
          type: number
          minimum: 1
          maximum: 5
        body:
          type: string
          maxLength: 2000
      required: [rating]
    Assignment:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        subject:
          type: string
        dueDate:
          type: string
          format: date
        dueLabel:
          type: string
        totalMinutes:
          type: number
        completedMinutes:
          type: number
        status:
          type: string
          enum: [on_track, at_risk, complete]
        accent:
          type: string
      required: [id, title, subject, dueDate, dueLabel, totalMinutes, completedMinutes, status, accent]
    StudyTask:
      type: object
      properties:
        id:
          type: number
        assignmentId:
          type: number
        title:
          type: string
        durationMinutes:
          type: number
        status:
          type: string
          enum: [todo, done]
        sortOrder:
          type: number
      required: [id, assignmentId, title, durationMinutes, status, sortOrder]
    StudySession:
      type: object
      properties:
        id:
          type: number
        taskId:
          type: number
        assignmentId:
          type: number
        title:
          type: string
        subject:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        durationMinutes:
          type: number
        status:
          type: string
          enum: [scheduled, complete, skipped]
        isToday:
          type: boolean
        accent:
          type: string
      required: [id, taskId, assignmentId, title, subject, date, startTime, endTime, durationMinutes, status, isToday]
    TodayFocus:
      type: object
      properties:
        sessionId:
          type: number
        taskId:
          type: number
        title:
          type: string
        subject:
          type: string
        startTime:
          type: string
        durationMinutes:
          type: number
        context:
          type: string
      required: [sessionId, taskId, title, subject, startTime, durationMinutes, context]
    WorkloadDay:
      type: object
      properties:
        date:
          type: string
          format: date
        dayLabel:
          type: string
        minutes:
          type: number
        sessionCount:
          type: number
        isToday:
          type: boolean
      required: [date, dayLabel, minutes, sessionCount, isToday]
    PlannerDashboard:
      type: object
      properties:
        greeting:
          type: string
        dateLabel:
          type: string
        todayFocus:
          oneOf:
            - $ref: "#/components/schemas/TodayFocus"
            - type: "null"
        todaySessions:
          type: array
          items:
            $ref: "#/components/schemas/StudySession"
        upcomingAssignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        workload:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadDay"
        totalMinutesThisWeek:
          type: number
        completedSessions:
          type: number
        streakDays:
          type: number
      required: [greeting, dateLabel, todayFocus, todaySessions, upcomingAssignments, workload, totalMinutesThisWeek, completedSessions, streakDays]
    PlannerSessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/StudySession"
      required: [sessions]
    StudyPlanInput:
      type: object
      properties:
        note:
          type: string
          minLength: 3
        availableMinutesPerDay:
          type: number
          minimum: 15
          maximum: 480
      required: [note]
    StudyPlan:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/StudyTask"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/StudySession"
        summary:
          type: string
      required: [assignments, tasks, sessions, summary]
    TaskUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [todo, done]
      required: [status]
    SessionRescheduleInput:
      type: object
      properties:
        date:
          type: string
          format: date
      required: [date]
    UserSettings:
      type: object
      properties:
        defaultAvailableMinutes:
          type: number
        blockedWeekdays:
          type: array
          items:
            type: number
        preferredTime:
          type: string
          enum: [morning, afternoon, evening]
      required: [defaultAvailableMinutes, blockedWeekdays, preferredTime]
    UserSettingsInput:
      type: object
      properties:
        defaultAvailableMinutes:
          type: number
          minimum: 15
          maximum: 480
        blockedWeekdays:
          type: array
          items:
            type: number
        preferredTime:
          type: string
          enum: [morning, afternoon, evening]

